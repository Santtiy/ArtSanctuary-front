<section class="intro">


  <div class="intro__main">
    <h1 class="intro__title">
      <span class="light">WHERE ART</span>
      <span class="bold">LIVES WITHOUT</span>
      <span class="bold">DISTRACTIONS</span>
    </h1>

    <p class="intro__description">{{ description }}</p>

    <button type="button" class="intro__cta" (click)="goTo('/register')">
      <span class="intro__cta-text">CREATE ACCOUNT</span>
      <span class="intro__cta-arrow material-symbols-outlined">arrow_outward</span>
    </button>
  </div>


  <aside class="intro__aside">
    <h3 class="intro__aside-title">Assisted micro-tools</h3>

    <ul class="intro__list">
      <li *ngFor="let tool of microTools" (click)="openTool(tool)">
        {{ tool }}
      </li>
    </ul>

    <p class="intro__aside-footer">
      Quick Assistance Utilities. Everything runs in your browser
    </p>
  </aside>

</section>
