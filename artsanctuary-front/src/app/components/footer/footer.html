<footer class="footer">

  <div class="footer__top">

  
    <div class="footer__brand">
      <div class="footer__logos">
        <img src="/images/img_ isotipo-artsanctuary.webp.png" alt="ArtSanctuary" class="footer__logo">
        <img src="/images/img_ wordmark-artsanctuary.webp.png" alt="ArtSanctuary" class="footer__wordmark">
        <span class="footer__divider"></span>
        <img src="/images/img_ logo-corpocarnaval.svg.png" alt="Corpocarnaval" class="footer__logo">
      </div>
      <p class="footer__description">
        Your creative sanctuary: references, portfolio and tools for the art community.
      </p>
    </div>


    <nav class="footer__column">
      <h4 class="footer__title">INDEX</h4>
      <a *ngFor="let link of indexLinks"
         [routerLink]="link.path"
         class="footer__link">
        {{ link.label | uppercase }}
        <span class="material-symbols-outlined">arrow_forward</span>
      </a>
    </nav>


    <nav class="footer__column">
      <h4 class="footer__title">ACCOUNT</h4>
      <a *ngFor="let link of accountLinks"
         [routerLink]="link.path"
         class="footer__link">
        {{ link.label | uppercase }}
        <span class="material-symbols-outlined">arrow_forward</span>
      </a>
    </nav>

  </div>

  <!-- Barra inferior -->
  <div class="footer__bottom">
    <p>© {{ currentYear }} ArtSanctuary. All rights reserved.</p>
  </div>

</footer>
