<article class="artwork-card">
  <div class="artwork-card__media">
    <img class="artwork-card__image" [src]="artwork.image" [alt]="artwork.title" />

    <span class="artwork-card__badge">{{ artwork.category | uppercase }}</span>

    <button
      type="button"
      class="artwork-card__like"
      [ngClass]="{ 'artwork-card__like--active': liked }"
      (click)="onLike($event)"
    >
      <span class="material-symbols-outlined artwork-card__like-icon">favorite</span>
      {{ totalLikes }}
    </button>
  </div>

  <div class="artwork-card__info">
    <div class="artwork-card__text">
      <h3 class="artwork-card__title">{{ artwork.title | uppercase }}</h3>
      <p class="artwork-card__author">{{ artwork.author }}</p>
    </div>

    <div class="artwork-card__arrow">
      <span class="material-symbols-outlined">north_east</span>
    </div>
  </div>
</article>
