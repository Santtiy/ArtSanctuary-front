<section class="recent-works">
  <header class="recent-works__header">
    <h2 class="recent-works__title">RECENT WORKS</h2>
    <a class="recent-works__link" routerLink="/gallery">
      VIEW ALL <span class="material-symbols-outlined">north_east</span>
    </a>
  </header>

  <div class="recent-works__grid">
    <app-artwork-card
      *ngFor="let artwork of artworks()"
      [artwork]="artwork"
      [liked]="isLiked(artwork.id)"
      (likeToggled)="onLikeToggled($event)"
    ></app-artwork-card>
  </div>
</section>
