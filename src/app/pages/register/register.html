<div class="register">
  <app-auth-panel></app-auth-panel>
  <div class="register__content">
    <form class="register__card" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <h1 class="register__title">CREATE ACCOUNT</h1>
      <div class="register__field">
        <label for="artist-name">ARTIST NAME</label>
        <input id="artist-name" formControlName="artistName" placeholder="Your artist name" autocomplete="nickname" aria-describedby="artist-name-error">
        <div id="artist-name-error" class="register__error" *ngIf="form.controls.artistName.touched">
          <p *ngIf="form.controls.artistName.hasError('required')">Artist name is required.</p>
          <p *ngIf="form.controls.artistName.hasError('minlength')">Minimum 3 characters.</p>
        </div>
      </div>
      <div class="register__field">
        <label for="email">EMAIL</label>
        <input id="email" type="email" formControlName="email" placeholder="correo@ejemplo.com" autocomplete="email" aria-describedby="email-error">
        <div id="email-error" class="register__error" *ngIf="form.controls.email.touched">
          <p *ngIf="form.controls.email.hasError('required')">Email is required.</p>
          <p *ngIf="form.controls.email.hasError('email')">Enter a valid email.</p>
        </div>
      </div>
      <div class="register__field">
        <label for="password">PASSWORD</label>
        <div class="register__password">
          <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password" placeholder="••••••••" autocomplete="new-password" aria-describedby="password-error">
          <button class="register__eye" type="button" [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'" [attr.aria-pressed]="showPassword()" (click)="togglePassword()">
            <span class="material-symbols-outlined" aria-hidden="true">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
        <div id="password-error" class="register__error" *ngIf="form.controls.password.touched">
          <p *ngIf="form.controls.password.hasError('required')">Password is required.</p>
          <p *ngIf="form.controls.password.hasError('minlength')">Minimum 8 characters.</p>
        </div>
      </div>
      <div class="register__field">
        <label for="confirm-password">CONFIRM PASSWORD</label>
        <div class="register__password">
          <input id="confirm-password" [type]="showConfirm() ? 'text' : 'password'" formControlName="confirmPassword" placeholder="••••••••" autocomplete="new-password" aria-describedby="confirm-password-error">
          <button class="register__eye" type="button" [attr.aria-label]="showConfirm() ? 'Hide confirmation password' : 'Show confirmation password'" [attr.aria-pressed]="showConfirm()" (click)="toggleConfirm()">
            <span class="material-symbols-outlined" aria-hidden="true">{{ showConfirm() ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
        <div id="confirm-password-error" class="register__error">
          <p *ngIf="form.controls.confirmPassword.touched && form.controls.confirmPassword.hasError('required')">Confirm password is required.</p>
          <p *ngIf="form.hasError('passwordsMismatch') && form.controls.confirmPassword.touched">Passwords do not match.</p>
        </div>
      </div>
      <p class="register__error" *ngIf="registerError()" role="alert">{{ registerError() }}</p>
      <button class="register__submit" type="submit">CREATE ACCOUNT</button>
    </form>
    <p class="register__login">Already have an account? <a routerLink="/login">Sign in</a></p>
  </div>
</div>
