<div class="login">
  <app-auth-panel></app-auth-panel>
  <div class="login__content">
    <form class="login__card" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <h1 class="login__title">SIGN IN</h1>
      <div class="login__field">
        <label for="email">EMAIL</label>
        <input id="email" type="email" formControlName="email" placeholder="correo@ejemplo.com" autocomplete="email" aria-describedby="email-error">
        <div id="email-error" class="login__error" *ngIf="form.controls.email.touched">
          <p *ngIf="form.controls.email.hasError('required')">Email is required.</p>
          <p *ngIf="form.controls.email.hasError('email')">Enter a valid email.</p>
        </div>
      </div>
      <div class="login__field">
        <label for="password">PASSWORD</label>
        <div class="login__password">
          <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password" placeholder="••••••••" autocomplete="current-password" aria-describedby="password-error">
          <button class="login__eye" type="button" [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'" [attr.aria-pressed]="showPassword()" (click)="togglePassword()">
            <span class="material-symbols-outlined" aria-hidden="true">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
        <div id="password-error" class="login__error" *ngIf="form.controls.password.touched">
          <p *ngIf="form.controls.password.hasError('required')">Password is required.</p>
          <p *ngIf="form.controls.password.hasError('minlength')">Minimum 8 characters.</p>
        </div>
      </div>
      <button class="login__forgot" type="button" (click)="forgotPassword()">Forgot your password?</button>
      <p class="login__info" *ngIf="infoMessage()" role="status">{{ infoMessage() }}</p>
      <p class="login__error" *ngIf="loginError()" role="alert">{{ loginError() }}</p>
      <button class="login__submit" type="submit">ENTER</button>
    </form>
    <p class="login__register">No account yet? <a routerLink="/register">Create account</a></p>
  </div>
</div>
